version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verseora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verseora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verseora_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-verseora}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verseora_user -d verseora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verseora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: verseora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verseora_user}:${POSTGRES_PASSWORD:-verseora_secure_password_2026}@postgres:5432/${POSTGRES_DB:-verseora}
      SECRET_KEY: ${SECRET_KEY:-verseora-production-signing-secret-change-me}
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: verseora-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:

